# One certificate, one file. Copy to config/certs/<name>.conf and run
#   ./scripts/new-cert.sh config/certs/<name>.conf
# Nothing here is secret; the acme-dns credentials are created next to it.

# Base domain, lowercase, no "*". The wildcard is added by wildcard=1.
domain=example.com

# 1: the certificate covers *.example.com and example.com.
# 0: only example.com.
wildcard=1

# Target servers of the rollout, comma or space separated, host or host:port.
# This list becomes config/groups/<group>.txt.
hosts=example.com web1.example.com

# Group name for config/groups/<group>.txt. Default: the domain.
group=example

# Optional: acme.sh certificate name. Default: *.example.com (wildcard=1) or
# example.com. Only set it for an existing certificate that uses another name.
#name=*.example.com

# Optional: file name on the target hosts. Default: wildcard.example.com
# (wildcard) or the certificate name. See "Certificate names and target path".
#deploy_name=wildcard.example.com

# Optional: directory on the target hosts, default /etc/ssl. The receiver must
# accept it (/etc/acme-target.dirs).
#deploy_path=/etc/ssl

# Optional: 3072, 4096, ec-256, ec-384 or ec-521.
#keylength=2048

# Optional: 1 = issue on the Let's Encrypt staging endpoint and do not deploy.
#staging=0
