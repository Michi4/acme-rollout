name: acme-rollout

services:
  acme:
    build: .
    image: acme-rollout:3.1.7
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./acme:/data
      - ./deploy:/data/deploy:ro
      - ./config:/config:ro
      - ./keys:/keys:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
